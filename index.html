<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <script src="d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s;
      background-color: white;
    }

    body.bg-blue { background-color: #3b82f6; }
    body.bg-pink { background-color: #ec4899; }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 14px;
      font-weight: 600;
    }

    #bg-toggle {
      width: 52px;
      height: 28px;
      background: #3b82f6;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: relative;
      transition: background 0.3s;
      padding: 0;
    }

    #bg-toggle[aria-checked="false"] {
      background: #ec4899;
    }

    #bg-toggle .thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
      pointer-events: none;
    }

    #bg-toggle[aria-checked="false"] .thumb {
      transform: translateX(24px);
    }

    .chart-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .chart-card svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .bar rect {
      fill: steelblue;
      transition: fill 0.2s;
    }

    .bar rect:hover {
      fill: #2a5f8f;
    }

    .bar text {
      fill: white;
      font-size: 12px;
      text-anchor: middle;
      pointer-events: none;
    }

    .axis text {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    .axis path,
    .axis line {
      stroke: #ccc;
    }
  </style>
</head>
<body class="bg-blue">
  <h1>Hello, World!</h1>

  <div class="toggle-container">
    <span>Blue</span>
    <button id="bg-toggle" role="switch" aria-checked="true" aria-label="Toggle background color">
      <span class="thumb"></span>
    </button>
    <span>Pink</span>
  </div>

  <div class="chart-card">
    <svg id="chart"></svg>
  </div>

  <script>
    const toggle = document.getElementById('bg-toggle');

    toggle.addEventListener('click', () => {
      const isBlue = document.body.classList.contains('bg-blue');
      document.body.classList.toggle('bg-blue', !isBlue);
      document.body.classList.toggle('bg-pink', isBlue);
      toggle.setAttribute('aria-checked', String(!isBlue));
    });

    const data = [
      { label: "Jan", value: 42 },
      { label: "Feb", value: 58 },
      { label: "Mar", value: 75 },
      { label: "Apr", value: 63 },
      { label: "May", value: 91 },
      { label: "Jun", value: 84 },
      { label: "Jul", value: 110 },
    ];

    const margin = { top: 20, right: 20, bottom: 40, left: 50 };
    const totalWidth = 600;
    const totalHeight = 400;
    const width = totalWidth - margin.left - margin.right;
    const height = totalHeight - margin.top - margin.bottom;

    const svg = d3.select("#chart")
      .attr("viewBox", `0 0 ${totalWidth} ${totalHeight}`)
      .attr("preserveAspectRatio", "xMidYMid meet")
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleBand()
      .domain(data.map(d => d.label))
      .range([0, width])
      .padding(0.25);

    const y = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.value) * 1.1])
      .range([height, 0]);

    svg.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

    svg.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(6));

    const bars = svg.selectAll(".bar")
      .data(data)
      .enter()
      .append("g")
      .attr("class", "bar");

    bars.append("rect")
      .attr("x", d => x(d.label))
      .attr("y", d => y(d.value))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.value));

    bars.append("text")
      .attr("x", d => x(d.label) + x.bandwidth() / 2)
      .attr("y", d => y(d.value) + 18)
      .text(d => d.value);
  </script>
</body>
</html>
